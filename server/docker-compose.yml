services:
  pocketbase:
    build: .
    container_name: pocketbase
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true